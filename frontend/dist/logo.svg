<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Shadow filter for icon depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Shield Base Outline -->
  <g filter="url(#softGlow)">
    <!-- Central Pillar / Balance Beam of Justice -->
    <!-- Pillar Base -->
    <path d="M190 395 C190 380 322 380 322 395 L340 420 L172 420 Z" fill="#ffffff" />
    <rect x="246" y="140" width="20" height="245" rx="10" fill="#ffffff" />

    <!-- Top Cap / Apex -->
    <circle cx="256" cy="130" r="18" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="4" />

    <!-- Balance Crossbar with Smooth Arc -->
    <path d="M110 195 Q256 165 402 195" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

    <!-- Center Pivot Ring -->
    <circle cx="256" cy="180" r="10" fill="#ffffff" />

    <!-- Left Balance Scale -->
    <line x1="130" y1="195" x2="95" y2="280" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="130" y1="195" x2="165" y2="280" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M80 280 Q130 325 180 280 Z" fill="#ffffff" />

    <!-- Right Balance Scale -->
    <line x1="382" y1="195" x2="347" y2="280" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="382" y1="195" x2="417" y2="280" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M332 280 Q382 325 432 280 Z" fill="#ffffff" />

    <!-- Sparkle Stars for Intelligence -->
    <path d="M375 110 Q385 125 400 125 Q385 125 375 140 Q365 125 350 125 Q365 125 375 110 Z" fill="#38bdf8" />
  </g>
</svg>
